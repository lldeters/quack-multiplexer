# quackmux configuration of the docker compose end-to-end test, service
# "gateway-idle": the same as gateway.yaml, but sessions without a query for
# 15 seconds are closed (scenario f). config_test.go checks that the files
# differ only in the session and engine timing.

server:
  listen: ":9494"
  # The session key comes from QUACKMUX_SESSION_KEY (docker-compose.yaml).

admin:
  listen: ":9495"
  tokenFile: /etc/quackmux/admin.token

auth:
  mode: static
  static:
    file: /etc/quackmux/users.yaml
    reloadInterval: 5s

defaults:
  # The static provider cannot launch per-user engines, so the default share
  # level is one that always has an engine.
  shareLevel: SERVER
  subdomain: default
  profile: default

session:
  # Heartbeats do not count as activity: an attached client that sends no
  # query for 15s loses its session. The reaper runs every second.
  idleTimeout: 15s
  checkInterval: 1s

engine:
  checkInterval: 1s

provider:
  type: static
  static:
    healthInterval: 2s
    engines:
      # SERVER share level: every user (scenarios a, e, g).
      - name: shared
        url: http://engine-shared:9494
        token: e2e-engine-shared-6b2d8f4a0c1e3957
        shareLevel: SERVER
        subdomain: default
        profile: default
      # GROUP share level of group "analytics" (scenarios b, c).
      - name: analytics
        url: http://engine-analytics:9494
        token: e2e-engine-analytics-9e4a2c6b8d0f1735
        shareLevel: GROUP
        owner: analytics
        subdomain: default
        profile: default

profiles:
  default:
    description: DuckDB 2.0 engines run by docker compose (engine-shared, engine-analytics)

overrides:
  # Scenario h: bob's queries are cancelled after 5s, alice's have no limit.
  - users: [bob]
    queryTimeout: 5s

audit:
  # Exercise the audit log with real PREPARE requests.
  enabled: true

log:
  level: debug
  format: text
