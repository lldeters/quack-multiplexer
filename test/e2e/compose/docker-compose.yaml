# Docker Compose environment of the quackmux end-to-end test (run.sh).
#
#   engine-shared      DuckDB 2.0 Quack server (image from images/engine) for the
#                      SERVER share level; its table "whoami" says 'shared'
#   engine-analytics   the same for the GROUP share level of group "analytics",
#                      hardened like a shared engine (authorization macro and
#                      post-start settings, images/engine/README.md)
#   gateway            quackmux in front of both (provider static, auth static)
#   gateway-idle       the same with session.idleTimeout 15s
#   client             DuckDB 2.0 CLI from the engine image (profile "client",
#                      started with "docker compose run")
#
# The credentials come from e2e.env, run.sh builds the images:
#
#   docker compose --env-file e2e.env up -d
#
# Engines and gateways run with a read-only root file system, without
# capabilities and with a tmpfs on /tmp, like their pods in Kubernetes.
name: quackmux-e2e

x-engine: &engine
  image: ${E2E_ENGINE_IMAGE:-quackmux/duckdb-engine:2.0.0}
  pull_policy: never
  restart: "no"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges=true"]
  networks: [e2e]

services:
  engine-shared:
    <<: *engine
    # The engine container contract (internal/engine/initsql.go).
    environment:
      QUACK_TOKEN: "${E2E_ENGINE_SHARED_TOKEN:?run run.sh or pass --env-file e2e.env}"
      QUACKMUX_DATABASE: ":memory:"
      QUACKMUX_PORT: "9494"
      QUACKMUX_INIT_SQL: "CREATE TABLE whoami AS SELECT 'shared' AS engine;"
      QUACKMUX_ENGINE_ID: "engine-shared"
      QUACKMUX_SHARE_LEVEL: "SERVER"
      QUACKMUX_OWNER: ""
      QUACKMUX_SUBDOMAIN: "default"
      QUACKMUX_PROFILE: "default"

  engine-analytics:
    <<: *engine
    environment:
      QUACK_TOKEN: "${E2E_ENGINE_ANALYTICS_TOKEN:?run run.sh or pass --env-file e2e.env}"
      QUACKMUX_DATABASE: ":memory:"
      QUACKMUX_PORT: "9494"
      QUACKMUX_INIT_SQL: |
        CREATE TABLE whoami AS SELECT 'analytics' AS engine;
        .read /usr/local/share/quackmux/authorize.sql
      QUACKMUX_POST_START_SQL: "SET enable_external_access = false; SET lock_configuration = true;"
      QUACKMUX_ENGINE_ID: "engine-analytics"
      QUACKMUX_SHARE_LEVEL: "GROUP"
      QUACKMUX_OWNER: "analytics"
      QUACKMUX_SUBDOMAIN: "default"
      QUACKMUX_PROFILE: "default"

  gateway:
    image: ${E2E_GATEWAY_IMAGE:-quackmux/quackmux:e2e}
    pull_policy: never
    restart: "no"
    command: ["serve", "-config", "/etc/quackmux/config.yaml"]
    environment:
      QUACKMUX_SESSION_KEY: "${E2E_SESSION_KEY:?run run.sh or pass --env-file e2e.env}"
    volumes:
      - ./config/gateway.yaml:/etc/quackmux/config.yaml:ro
      - ./config/users.yaml:/etc/quackmux/users.yaml:ro
      - ./config/admin.token:/etc/quackmux/admin.token:ro
    ports:
      # Quack (for a local DuckDB: ATTACH 'quack:localhost:19494') and admin API.
      - "127.0.0.1:${E2E_QUACK_PORT:-19494}:9494"
      - "127.0.0.1:${E2E_ADMIN_PORT:-19495}:9495"
    depends_on: [engine-shared, engine-analytics]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    networks: [e2e]

  gateway-idle:
    image: ${E2E_GATEWAY_IMAGE:-quackmux/quackmux:e2e}
    pull_policy: never
    restart: "no"
    command: ["serve", "-config", "/etc/quackmux/config.yaml"]
    environment:
      QUACKMUX_SESSION_KEY: "${E2E_SESSION_KEY:?run run.sh or pass --env-file e2e.env}"
    volumes:
      - ./config/gateway-idle.yaml:/etc/quackmux/config.yaml:ro
      - ./config/users.yaml:/etc/quackmux/users.yaml:ro
      - ./config/admin.token:/etc/quackmux/admin.token:ro
    ports:
      - "127.0.0.1:${E2E_IDLE_QUACK_PORT:-19594}:9494"
      - "127.0.0.1:${E2E_IDLE_ADMIN_PORT:-19595}:9495"
    depends_on: [engine-shared, engine-analytics]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    networks: [e2e]

  client:
    image: ${E2E_ENGINE_IMAGE:-quackmux/duckdb-engine:2.0.0}
    pull_policy: never
    profiles: [client]
    # The plain DuckDB CLI instead of the engine entrypoint; it reads SQL from
    # stdin: docker compose run --rm -T --no-deps client -bail < script.sql
    entrypoint: ["/usr/local/bin/duckdb"]
    environment:
      HOME: "/tmp"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
    networks: [e2e]

networks:
  e2e: {}
