# Checks for every pull request and every push to main: formatting, vet, the
# tests (also with the race detector), cross builds, the shipped
# configurations and manifests, the Helm chart, shell scripts and workflows,
# and the end to end tests against the released DuckDB with Docker Compose
# and kind.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The e2e builds verify the DuckDB download with the checksums in the
  # Makefile (DUCKDB_SHA256_*).
  KIND_VERSION: v0.33.0
  KUBECONFORM_VERSION: v0.8.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  checks:
    name: Format, vet, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: Tests
        run: go test -count=1 ./...
      - name: Tests with the race detector
        run: go test -race -count=1 ./...

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: "386" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build all packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./... && go vet ./...

  manifests:
    name: Configs, manifests, scripts, workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Validate the shipped gateway configurations
        run: |
          for f in examples/config*.yaml deploy/kubernetes/base/config.yaml deploy/kubernetes/overlays/*/config.yaml \
            test/e2e/compose/config/gateway*.yaml; do
            echo "== $f"
            go run ./cmd/quackmux validate -config "$f"
          done
      - name: Render and validate the Kubernetes manifests
        run: |
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          for o in deploy/kubernetes/base deploy/kubernetes/overlays/*/; do
            echo "== $o"
            kubectl kustomize "$o" | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.30.0 -
          done
      - name: Image references name one release
        run: bash scripts/check-image-refs.sh
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR test/e2e/lib/*.sh test/e2e/compose/*.sh test/e2e/kind/*.sh images/engine/*.sh scripts/*.sh
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint"

  helm:
    name: Helm chart (Helm ${{ matrix.helm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both major versions of Helm, built from source like the other tools.
        helm: [v3.22.1, v4.3.2]
    env:
      HELM_VERSION: ${{ matrix.helm }}
    defaults:
      run:
        # -o pipefail: a failing helm template must fail the pipe.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install helm and kubeconform
        run: |
          go install "helm.sh/helm/${HELM_VERSION%%.*}/cmd/helm@${HELM_VERSION}"
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: helm lint
        run: |
          helm lint --strict deploy/helm/quackmux
          helm lint --strict deploy/helm/quackmux --set ha.enabled=true
          helm lint --strict deploy/helm/quackmux -f test/helm/testdata/values-options.yaml
      - name: Render and validate the chart
        run: |
          check() {
            echo "== helm template $*"
            helm template quackmux deploy/helm/quackmux --namespace quackmux --kube-version 1.30.0 "$@" |
              kubeconform -strict -summary -kubernetes-version 1.30.0 -
          }
          check
          check --set ha.enabled=true
          check -f test/helm/testdata/values-options.yaml
      # The rendering with default values must equal kubectl kustomize of
      # deploy/kubernetes/base, the one with ha.enabled that of overlays/ha
      # (test/helm, deploy/helm/quackmux/README.md).
      - name: Compare with the Kustomize manifests, chart tests
        run: QUACKMUX_HELM=helm go test -count=1 -v ./test/helm/

  e2e-compose:
    name: End-to-end (Docker Compose)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the images and run the scenarios
        run: bash test/e2e/compose/run.sh

  e2e-kind:
    name: End-to-end (kind)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # helm.sh: the Helm 3 of the helm job's matrix.
      HELM_VERSION: v3.22.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install kind and helm
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          go install "helm.sh/helm/${HELM_VERSION%%.*}/cmd/helm@${HELM_VERSION}"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Create the cluster, build and load the images, deploy the dev overlay
        run: bash test/e2e/kind/setup.sh
      # k5-k8 (persistent profile) use kind's default StorageClass, which
      # supports ReadWriteOncePod.
      - name: Scenarios k1-k8
        run: bash test/e2e/kind/test.sh
      # The chart's lookups of the cluster (kept secrets, the refusal of a
      # second gateway and of an early switch to HA), which the helm job
      # cannot reach with helm template.
      - name: Helm chart scenarios
        run: bash test/e2e/kind/helm.sh
