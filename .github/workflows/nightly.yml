# Slow checks that do not run for every pull request: the high availability
# scenarios in kind (test/e2e/kind/ha.sh, about 5 minutes), the tests with
# the race detector repeated, to find flaky tests, and govulncheck, for
# vulnerabilities published since the last change. Scheduled runs use the
# default branch; start a run for another branch with "Run workflow".
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  KIND_VERSION: v0.33.0
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  kind-ha:
    name: High availability (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Create the cluster, build and load the images, deploy the dev overlay
        run: bash test/e2e/kind/setup.sh
      - name: Scenarios k1-k8 (dev overlay)
        run: bash test/e2e/kind/test.sh
      - name: Scenarios h1-h6 (HA overlay)
        run: bash test/e2e/kind/ha.sh

  race-repeated:
    name: Race detector, five runs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test -race -count=5
        run: go test -race -count=5 ./...

  vulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...
