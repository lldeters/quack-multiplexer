# Static engines: quackmux routes sessions to Quack servers that run
# elsewhere (started by hand, systemd, another orchestrator). The gateway
# never starts, drains or stops them; a failed health probe (GET /) takes an
# engine out of rotation and a successful one brings it back. CONNECTION
# share level is not possible (it needs a new engine per session).
#
#   bin/quackmux.exe serve -config examples/config.static.yaml
#
# Each engine serves Quack over plain HTTP on an address the gateway can
# reach, with the token configured below. The engine image (images/engine)
# does that; by hand, in a DuckDB 2.0 CLI that keeps running, with
# QUACK_TOKEN in its environment:
#   SELECT listen_uri FROM quack_serve('quack:0.0.0.0:9494',
#       token = getenv('QUACK_TOKEN'), allow_other_hostname = true,
#       disable_ssl = true);
#   SELECT 'started';
# Every session of the engine can read the last result of this CLI
# (FROM _): the row of quack_serve holds the token, so select only
# listen_uri and end with a harmless SELECT. Also keep the CLI's standard
# input out of the sessions' reach (images/engine/README.md, "Sicherheit").
# Shield the engines so that only the gateway can reach them. Shared
# engines are hardened on the engines themselves, not in the profiles below
# (images/engine/README.md):
#   QUACKMUX_INIT_SQL=".read /usr/local/share/quackmux/authorize.sql"
#   QUACKMUX_POST_START_SQL="SET enable_external_access = false; SET lock_configuration = true;"

server:
  listen: ":9494"
  # Keeps sessions alive across gateway restarts:
  # sessionKeyFile: /etc/quackmux/session/key

admin:
  listen: "127.0.0.1:9495"
  # tokenFile: /etc/quackmux/admin/token

auth:
  mode: static
  static:
    # Relative to the working directory of the gateway (here: the
    # repository root).
    file: examples/users.yaml
    reloadInterval: 10s

# Everybody lands on the shared engine ...
defaults:
  shareLevel: SERVER
  subdomain: default
  profile: default

# ... except members of the group "analytics", who get their group's engine.
# GROUP uses the first group of a user (or the token option "group"), so a
# user whose first group has no engine below gets an error.
overrides:
  - groups: [analytics]
    defaults:
      shareLevel: GROUP

# After a restart the gateway can close the connections of clients that died
# while it was down (the Quack server never collects them). With static
# engines this is off: switch it on only if no other gateway or client uses
# these engines, or it would close their connections.
# engine:
#   closeOrphanedConnections: true

provider:
  type: static
  static:
    # Period of the GET / health probes.
    healthInterval: 10s
    # Probes that must fail in a row before an engine (and every session on
    # it) is taken out of rotation.
    failureThreshold: 3
    engines:
      # One engine for all users (share level SERVER).
      - name: shared
        url: http://duckdb-shared.internal.example:9494
        # The engine's token (QUACK_TOKEN of quack_serve). "token" works as
        # well, but keeps the secret in this file.
        tokenFile: /etc/quackmux/engines/shared.token
        shareLevel: SERVER
        subdomain: default
        profile: default
      # The engine of the group "analytics" (share level GROUP).
      - name: analytics
        url: http://duckdb-analytics.internal.example:9494
        tokenFile: /etc/quackmux/engines/analytics.token
        shareLevel: GROUP
        owner: analytics
        subdomain: default
        profile: default

profiles:
  default:
    description: "Externally managed DuckDB servers"
    # Only the share levels that have engines above; other requests are
    # rejected with a clear message instead of "no engine is available".
    allowedShareLevels: [SERVER, GROUP]

audit:
  enabled: true

log:
  level: info
  format: json
