# Keeps one ready gateway through voluntary evictions such as "kubectl
# drain". Followers are ready too, so the leader may be evicted while a
# follower is ready: it removes its label, releases the lease, and the
# follower takes over within seconds. The last ready replica is never
# evicted; an unready one always may be.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quackmux
  labels:
    app.kubernetes.io/name: quackmux
    app.kubernetes.io/component: gateway
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: quackmux
      app.kubernetes.io/component: gateway
