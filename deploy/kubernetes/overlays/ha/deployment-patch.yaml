# Two replicas; a rollout starts a new pod before it removes an old one.
#
# Every healthy replica is ready: the leader, and a follower once it
# campaigns for the lease (3 x ha.retryPeriod after its start) and has made
# sure that its pod does not carry the leader label. A rollout therefore
# proceeds on its own: new pod ready (a follower), old follower removed,
# second new pod ready, old leader removed. The leader gives its pod a
# deletion cost (controller.kubernetes.io/pod-deletion-cost, overwriting a
# value from the template), so the old ReplicaSet removes the follower
# first, and a rollout hands over exactly once, to a new pod. Never fewer
# than two ready replicas, at most three pods. Without room for a third
# gateway pod, use maxSurge 0 and maxUnavailable 1: the follower goes first,
# and there is no standby until its replacement is ready. See README.md,
# "Hochverfügbarkeit".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quackmux
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      # Prefer different nodes, so that a node failure leaves a follower.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: quackmux
                    app.kubernetes.io/component: gateway
