# High availability: two gateway replicas with leader election on a
# Kubernetes Lease. Both replicas are ready; the leader labels its pod
# quackmux.io/leader=true, and the Service routes to that label alone
# (service-patch.yaml). The follower takes over when the leader goes away
# (sessions survive, running requests fail). Rollouts, "kubectl rollout
# status", "kubectl drain" and health checks work as usual (README.md,
# "Hochverfügbarkeit").
#
#   kubectl apply -k deploy/kubernetes/overlays/ha
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quackmux

labels:
  - pairs:
      app.kubernetes.io/part-of: quackmux
    includeSelectors: false

resources:
  - ../../base
  - pdb.yaml

# The complete configuration with ha.enabled: true replaces the base config.
configMapGenerator:
  - name: quackmux-config
    behavior: replace
    files:
      - config.yaml

patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml
