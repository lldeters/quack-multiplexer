# Identity of the gateway at the Kubernetes API (see rbac.yaml).
#
# The token is not mounted automatically: only the gateway pod opts in
# (deployment.yaml). Engine pods must never run with this account; profiles
# that need an identity for the engines set profiles.<name>.serviceAccountName
# to an account of their own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quackmux-gateway
  labels:
    app.kubernetes.io/name: quackmux
    app.kubernetes.io/component: gateway
automountServiceAccountToken: false
