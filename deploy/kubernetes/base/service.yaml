# Cluster-internal access to the gateway:
#   Quack:  quack:quackmux.quackmux.svc.cluster.local:9494
#   Admin:  http://quackmux.quackmux.svc.cluster.local:9495 (API, /metrics)
#
# Only ready gateway pods receive traffic; with ha.enabled that is the leader.
apiVersion: v1
kind: Service
metadata:
  name: quackmux
  labels:
    app.kubernetes.io/name: quackmux
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quackmux
    app.kubernetes.io/component: gateway
  ports:
    - name: quack
      port: 9494
      targetPort: quack
      protocol: TCP
    - name: admin
      port: 9495
      targetPort: admin
      protocol: TCP
