# PLACEHOLDER users file for auth.mode=static - replace before production use.
#
# Mounted at /etc/quackmux/users/users.yaml (auth.static.file). The gateway
# re-reads it when it changes; an invalid file is rejected and the previous
# users stay active.
#
# The token of the sample user alice is "change-me-example-token-0000". It is
# public (it is in this repository): generate real tokens with
#   quackmux token            -> token for the user, sha256 for this file
#   quackmux hash-token TOKEN -> sha256 of an existing token
# and store only their sha256 here. Format: examples/users.yaml.
users:
  - name: alice
    # The first group is the default for share_level=group.
    groups: [analytics]
    tokens:
      # sha256 of "change-me-example-token-0000"
      - sha256: "cef58a2821dd799a53522c76b3e602d8534f044586a2eb12a890e09e3a8f2de2"
        description: "example token - replace"
