# Network isolation. Enforced only if the cluster's CNI implements
# NetworkPolicy (Calico, Cilium, ...).
#
# Engines: Quack traffic is accepted from the gateway only, so that clients
# can never bypass authentication, policy and session handling. (Users of a
# shared engine can read its token with getenv('QUACK_TOKEN').) Kubelet probes
# from the node are not affected. Egress is open for the cluster and the
# internet (engines read data from object stores, HTTP servers and
# databases) except the cloud metadata service: every SQL user of an engine
# can send HTTP requests (httpfs), and on many clouds the metadata service
# hands out the node's credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quackmux-engines
  labels:
    app.kubernetes.io/name: quackmux
    app.kubernetes.io/component: engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: engine
      app.kubernetes.io/managed-by: quackmux
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quackmux
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 9494
  # To restrict egress further, replace the rules with DNS plus the networks
  # the engines need, e.g.:
  #   - to:
  #       - namespaceSelector: {}
  #         podSelector:
  #           matchLabels:
  #             k8s-app: kube-dns
  #     ports:
  #       - {protocol: UDP, port: 53}
  #       - {protocol: TCP, port: 53}
  #   - to:
  #       - ipBlock: {cidr: 10.20.0.0/16}   # object store
  #     ports:
  #       - {protocol: TCP, port: 443}
  egress:
    # Pods and services of the cluster (DNS, in-cluster databases and object
    # stores). Some CNIs never match pod addresses with ipBlock rules.
    - to:
        - namespaceSelector: {}
    # Everything else, except the metadata service (IPv4 and the IPv6
    # address of AWS).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
        - ipBlock:
            cidr: ::/0
            except: [fd00:ec2::254/128]
---
# Gateway: the Quack port is open for every client, the admin port (API,
# probes, /metrics) only for pods of this namespace that are not engines:
# SQL users of an engine could otherwise call the admin API through httpfs.
# To let a Prometheus in another namespace scrape /metrics, add to the second
# rule's "from":
#   - namespaceSelector:
#       matchLabels:
#         kubernetes.io/metadata.name: monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quackmux-gateway
  labels:
    app.kubernetes.io/name: quackmux
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: quackmux
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 9494
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: NotIn
                values: [engine]
      ports:
        - protocol: TCP
          port: 9495
