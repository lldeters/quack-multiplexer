# Network isolation. Enforced only if the cluster's CNI implements
# NetworkPolicy (Calico, Cilium, ...).
#
# Engines: Quack traffic is accepted from the gateway only, so that clients
# can never bypass authentication, policy and session handling. (Users of a
# shared engine can read its token with getenv('QUACK_TOKEN').) Kubelet probes
# from the node are not affected. Egress stays open: engines read data from
# object stores, HTTP servers and databases.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quackmux-engines
  labels:
    app.kubernetes.io/name: quackmux
    app.kubernetes.io/component: engine
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: engine
      app.kubernetes.io/managed-by: quackmux
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quackmux
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 9494
  # Open egress. To restrict it, replace the rule with DNS plus the networks
  # the engines need, e.g.:
  #   - to:
  #       - namespaceSelector: {}
  #         podSelector:
  #           matchLabels:
  #             k8s-app: kube-dns
  #     ports:
  #       - {protocol: UDP, port: 53}
  #       - {protocol: TCP, port: 53}
  #   - to:
  #       - ipBlock: {cidr: 10.20.0.0/16}   # object store
  #     ports:
  #       - {protocol: TCP, port: 443}
  egress:
    - {}
---
# Gateway: the Quack port is open for every client, the admin port (API,
# probes, /metrics) only for pods of this namespace. To let a Prometheus in
# another namespace scrape /metrics, add to the second rule's "from":
#   - namespaceSelector:
#       matchLabels:
#         kubernetes.io/metadata.name: monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quackmux-gateway
  labels:
    app.kubernetes.io/name: quackmux
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: quackmux
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 9494
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9495
