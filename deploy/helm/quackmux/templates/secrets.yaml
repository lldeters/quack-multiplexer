{{- /*
The gateway's secrets, unless existing ones are named (secrets.*.existingSecret).
The session key and the admin token are random and generated once: an
upgrade keeps the values the Secrets in the cluster have (lookup). The users
file comes from the values "users". Keys and mount paths are those of
deploy/kubernetes/base.
*/ -}}
{{- $fullname := include "quackmux.fullname" . -}}
{{- if not .Values.secrets.sessionKey.existingSecret }}
# server.sessionKeyFile: seals gateway connection ids. Identical on all
# replicas; changing it ends all sessions.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-session-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quackmux.labels" (dict "root" . "component" "gateway") | nindent 4 }}
type: Opaque
data:
  key: {{ include "quackmux.secretData" (dict "root" . "name" (printf "%s-session-key" $fullname) "key" "key") | quote }}
{{- end }}
{{- if not .Values.secrets.adminToken.existingSecret }}
---
# admin.tokenFile: bearer token of the admin API.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-admin-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quackmux.labels" (dict "root" . "component" "gateway") | nindent 4 }}
type: Opaque
data:
  token: {{ include "quackmux.secretData" (dict "root" . "name" (printf "%s-admin-token" $fullname) "key" "token") | quote }}
{{- end }}
{{- if not .Values.secrets.users.existingSecret }}
---
# auth.static.file: users, groups and token hashes. Updated in place; the
# gateway picks up a change without a restart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-users
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "quackmux.labels" (dict "root" . "component" "gateway") | nindent 4 }}
type: Opaque
data:
  users.yaml: {{ include "quackmux.usersFile" . | b64enc | quote }}
{{- end }}
